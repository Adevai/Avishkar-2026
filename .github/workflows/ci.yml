name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same branch/PR to save minutes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest

    # Hard stop so a hung test/server can't burn the 6h default limit
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avishkar_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: avishkar_db
      PGUSER: postgres
      PGPASSWORD: postgres
      JWT_SECRET: ci-secret-0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck server
        run: npm run typecheck:server

      - name: Typecheck client + build config
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      # NODE_ENV is scoped to the test step only — a job-level NODE_ENV=test
      # leaks into `vite build` and produces a wrong-mode production bundle.
      - name: Unit + API tests (against PostgreSQL service)
        run: npm test
        env:
          NODE_ENV: test
          # e2e tests boot the Express app via supertest but must NOT listen
          # (no START_SERVER) and must init the schema on the empty CI DB —
          # server/api.e2e.test.ts calls initDatabase() in beforeAll.
          START_SERVER: 'false'

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
